<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 132 132" width="132" height="132" role="img" aria-label="Vandal">
  <defs>
    <linearGradient id="sprayFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff2bd6"/>
      <stop offset=".45" stop-color="#7a3cff"/>
      <stop offset="1" stop-color="#19f0ff"/>
    </linearGradient>
    <filter id="sprayRough" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <!-- brick-ish tile -->
  <rect x="4" y="4" width="124" height="124" rx="18" fill="#111218"/>
  <rect x="4" y="4" width="124" height="124" rx="18" fill="url(#sprayFill)" opacity=".92"/>
  <!-- mist / overspray -->
  <g fill="#fff" opacity=".28">
    <circle cx="18" cy="22" r="1.6"/>
    <circle cx="28" cy="14" r="1.1"/>
    <circle cx="114" cy="20" r="1.4"/>
    <circle cx="122" cy="34" r="0.9"/>
    <circle cx="16" cy="110" r="1.3"/>
    <circle cx="108" cy="118" r="1.7"/>
    <circle cx="96" cy="12" r="0.8"/>
    <circle cx="40" cy="120" r="1"/>
    <circle cx="70" cy="8" r="0.7"/>
  </g>
  <!-- paint drips -->
  <path fill="#19f0ff" d="M28 112 c0 8 3 16 3 22 c0 4-2 6-4 6 c-3 0-4-3-4-7 c0-6 2-14 2-21z" opacity=".85"/>
  <path fill="#ff2bd6" d="M96 108 c1 10 4 18 4 24 c0 3-1 5-3 5 c-3 0-4-3-4-7 c0-7 1-15 1-22z" opacity=".9"/>
  <!-- stencil V with fat spray stroke -->
  <g filter="url(#sprayRough)">
    <path d="M28 34 L52 34 L66 86 L80 34 L104 34 L74 108 L58 108 Z" fill="#0a0a0c" opacity=".35" transform="translate(3,4)"/>
    <path d="M26 32 L52 32 L66 86 L80 32 L106 32 L76 110 L56 110 Z" fill="#ffffff"/>
    <path d="M40 38 L52 38 L66 92 L80 38 L92 38 L76 102 L56 102 Z" fill="#19f0ff" opacity=".35"/>
  </g>
  <!-- cap tag accent -->
  <path d="M88 48c10-14 28-10 22 8c-3 10-16 16-22 6c4 2 10-2 10-8c0-8-8-10-10-6z" fill="#ffe14a"/>
</svg>
