<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 132 132" width="132" height="132" role="img" aria-label="Vandal">
  <!-- Vandal mark — rounded tile, indigo→cyan gradient, white play glyph -->
  <defs>
    <linearGradient id="vg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7382ff"/>
      <stop offset=".55" stop-color="#5b8dff"/>
      <stop offset="1" stop-color="#2fd9ff"/>
    </linearGradient>
    <linearGradient id="vgloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".26"/>
      <stop offset=".55" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="124" height="124" rx="30" fill="url(#vg)"/>
  <rect x="4" y="4" width="124" height="124" rx="30" fill="url(#vgloss)"/>
  <!-- play glyph with softly rounded corners (stroke-join round trick) -->
  <path d="M50 38 L98 66 L50 94 Z" fill="#ffffff" stroke="#ffffff" stroke-width="16" stroke-linejoin="round"/>
</svg>
