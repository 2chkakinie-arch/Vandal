<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 88" role="img" aria-labelledby="title desc">
  <title id="title">Vandal</title>
  <desc id="desc">Vandal wordmark in a bold spray-paint style</desc>
  <defs>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#111827"/>
      <stop offset=".34" stop-color="#e11d48"/>
      <stop offset=".67" stop-color="#ff8a00"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="rough" x="-8%" y="-24%" width="116%" height="160%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency=".025 .22" numOctaves="2" seed="11" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.7" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="lift" x="-8%" y="-20%" width="116%" height="150%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2" result="blur"/>
      <feOffset dy="3" result="offset"/>
      <feFlood flood-color="#0f172a" flood-opacity=".28"/>
      <feComposite in2="offset" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Text-only wordmark: the offset paint echo and rough edge create the spray-art feel. -->
  <g font-family="Impact, Haettenschweiler, 'Arial Narrow Bold', 'Arial Black', sans-serif" font-size="68" font-weight="900" font-style="italic" letter-spacing="-3" textLength="300" lengthAdjust="spacingAndGlyphs">
    <text x="10" y="66" fill="#ff2f78" opacity=".32" transform="translate(-3 2)">Vandal</text>
    <text x="10" y="66" fill="url(#word)" stroke="#111827" stroke-opacity=".18" stroke-width="1.5" paint-order="stroke fill" filter="url(#lift)">
      Vandal
    </text>
    <text x="10" y="66" fill="url(#word)" opacity=".88" filter="url(#rough)">Vandal</text>
  </g>
</svg>
